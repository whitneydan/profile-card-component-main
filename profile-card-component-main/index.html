<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Profile card component</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="container">
      <div id="bg-image"></div>
      <div id="imgContainer">
        <img src="images/image-victor.jpg" alt="picture" />
      </div>
      <p id="profileName">Victor Crest <span id="profileAge">26</span></p>
      <p id="Location">London</p>
      <hr>
      <div id="engagement">
      <div>
        <p class="rating">80K</p>
        <p class="rating2">Followers</p>
      </div>
      <div>
        <p class="rating">803K</p>
        <p class="rating2">Likes</p>
      </div>
      <div>
        <p class="rating">1.4k</p>
        <p class="rating2">Photos</p>
        </div>
      </div>
    </div>
  </body>
</html>
